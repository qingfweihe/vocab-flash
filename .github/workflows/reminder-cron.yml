name: reminder-cron

# 每 5 分钟触发一次推送检查（北京时间由服务端函数换算）
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # 手动触发（调试用）

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call reminder endpoint
        run: |
          echo "Beijing time: $(TZ=Asia/Shanghai date '+%F %T')"
          curl -sS -m 60 "https://vocab-flash.netlify.app/api/cron-notify?key=vf-reminder-9f3k2" -o /tmp/out.json -w "HTTP %{http_code}\n" || true
          head -c 500 /tmp/out.json || true
